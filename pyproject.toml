[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatlens"
version = "0.2.0"
description = "Privacy-first WhatsApp chat parsing, analytics and NLP toolkit"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "emoji>=2.10", "pyyaml>=6.0",
  "joblib>=1.3", "vaderSentiment>=3.3", "textblob>=0.18", "yake>=0.4.8", "plotly>=5.20",
  "matplotlib>=3.8", "wordcloud>=1.9", "psutil>=5.9",
]

[project.optional-dependencies]
app = ["gradio>=5", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
tracking = ["mlflow>=2.12"]
transformers = ["torch", "transformers>=4.40", "sentence-transformers>=3", "bertopic>=0.16", "spacy>=3.7"]
kaggle = ["kaggle>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "gradio_client"]

[project.scripts]
chatlens-app = "chatlens.app.gradio_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
